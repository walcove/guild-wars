name: verify
on: [push, pull_request]
permissions:
  contents: read
concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  application:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run verify
      - run: npm run test:contracts
  postgres-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.11
        env:
          POSTGRES_USER: guild_wars_migrator
          POSTGRES_PASSWORD: local_migration_only
          POSTGRES_DB: guild_wars_test
        ports: ["54329:5432"]
        options: >-
          --health-cmd "pg_isready -U guild_wars_migrator -d guild_wars_test"
          --health-interval 2s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://guild_wars_migrator:local_migration_only@127.0.0.1:54329/guild_wars_test
      DATABASE_URL: postgresql://guild_wars_app:local_app_only@127.0.0.1:54329/guild_wars_test
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f scripts/init-test.sql
      - run: npm run db:migrate:test
      - run: npm run db:worker:migrate:test
      - run: npm run db:migrate:test # idempotent migration replay
      - run: npm run test:integration
  browser:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.11
        env:
          POSTGRES_USER: guild_wars_migrator
          POSTGRES_PASSWORD: local_migration_only
          POSTGRES_DB: guild_wars_test
        ports: ["54329:5432"]
        options: >-
          --health-cmd "pg_isready -U guild_wars_migrator -d guild_wars_test"
          --health-interval 2s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://guild_wars_migrator:local_migration_only@127.0.0.1:54329/guild_wars_test
      DATABASE_URL: postgresql://guild_wars_app:local_app_only@127.0.0.1:54329/guild_wars_test
      GW_DATA_ENABLED: "false"
      GW_TELEGRAM_SENDING_ENABLED: "false"
      GW_LIVE_PREPARATION_ENABLED: "false"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f scripts/init-test.sql
      - run: npm run db:migrate:test
      - run: npm run db:worker:migrate:test
      - run: npm run db:migrate:test # idempotent migration replay
      - run: npm run build
      - run: npm run test:e2e
        env:
          GW_E2E_PRODUCTION: "true"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: failure()
        with:
          name: browser-failure-evidence
          path: test-results/
