services:
  postgres:
    image: postgres:16.11
    environment:
      POSTGRES_USER: guild_wars_migrator
      POSTGRES_PASSWORD: local_migration_only
      POSTGRES_DB: guild_wars_test
    ports:
      - "127.0.0.1:54329:5432"
    volumes:
      - ./scripts/init-test.sql:/docker-entrypoint-initdb.d/001-runtime-role.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U guild_wars_migrator -d guild_wars_test"]
      interval: 2s
      timeout: 3s
      retries: 20
