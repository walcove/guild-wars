<body><main class="study">
<header class="study-header"><div><h1>Guild Wars · Research together. Decide in Telegram.</h1><p class="study-caption">Desktop & mobile design preview · All prices, data, messages, and results are hypothetical. Buttons stay inside this preview; no messages or trades are sent.</p></div><div class="switch" aria-label="Preview device"><button id="desktop-mode" class="chosen" onclick="setDevice('desktop')">Desktop</button><button id="mobile-mode" onclick="setDevice('mobile')">Mobile</button></div></header>
<div id="journey" class="journey" aria-label="Telegram and app journey"></div><nav id="screen-picker" class="screen-picker" aria-label="Explore all proposed screens"></nav>
<div id="preview" class="preview desktop"><div id="platform-location" class="platform-location" aria-live="polite"></div><div class="app"><header class="app-top"><button class="brand" onclick="go('home')">GUILD WARS<small>Apex Syndicate</small></button><nav id="main-nav" class="main-nav" aria-label="App navigation"></nav><span class="account">Individual account · Live guild</span></header><div id="app-main" class="app-main"></div><nav id="bottom-nav" class="bottom-nav" aria-label="Mobile navigation"></nav></div><div class="prototype-nav"><button onclick="previousScreen()">← Previous screen</button><span id="screen-counter"></span><button onclick="nextScreen()">Next screen →</button></div></div>
<p id="screen-note" class="screen-note"></p>
</main>
<script>
const screens = [
  {id:'telegram',name:'Telegram invite',place:'Telegram',stage:0,note:'Start in the regular Telegram group. The research link opens the standalone app at this guild’s current round.'},
  {id:'research',name:'Research workspace',place:'Guild Wars app',stage:1,note:'A shared starting point: market context, upcoming events, two call choices, and sourced guild notes.'},
  {id:'scenarios',name:'Compare outcomes',place:'Guild Wars app',stage:1,note:'Compare the whole covered position with simply holding. Change the ending price to see both the upside cap and downside.'},
  {id:'plan',name:'Build a plan',place:'Guild Wars app',stage:2,note:'Three simple choices and a short explanation. Draft terms carry through to the Telegram proposal.'},
  {id:'brief',name:'Review proposal',place:'Guild Wars app',stage:2,note:'Read the exact brief before sharing. Publishing here only advances this local design preview.'},
  {id:'debate',name:'Telegram debate',place:'Telegram',stage:3,note:'The plan arrives as a readable bot message. Members discuss in Telegram and open the linked research when needed.'},
  {id:'vote',name:'Telegram ballot',place:'Telegram',stage:3,note:'Vote without leaving Telegram. Each ballot refers to a fixed plan version; the preview supports changing your vote.'},
  {id:'decision',name:'Telegram result',place:'Telegram',stage:3,note:'The bot publishes a fixed example result. This is a separate preview state, not a result calculated from one local vote.'},
  {id:'review',name:'Your trade review',place:'Guild Wars app',stage:4,note:'The winning plan opens in the app. Each member sets their own quantity, checks a fresh quote, and authorizes with the provider.'},
  {id:'position',name:'Your position',place:'Guild Wars app',stage:4,note:'An illustrative confirmed fill. Provider execution, actual fill verification, and settlement are future integrations.'},
  {id:'midweek',name:'Telegram check-in',place:'Telegram',stage:5,note:'The bot brings the guild back for one scheduled response round, with a link to updated app research.'},
  {id:'results',name:'Round results',place:'Guild Wars app',stage:5,note:'Review the whole position after fees, compare with holding, and recognize useful research contributions.'},
  {id:'alpha',name:'Between rounds',place:'Guild Wars app',stage:1,note:'Broader crypto and stock research continues between rounds. Recognition rewards useful evidence and challenges.'}
];
const state={screen:'telegram',device:'desktop',strike:110,quantity:1,vote:null,reviewed:false,providerReview:false,forecastSaved:false,scenario:105,shared:false,midVote:null,linked:false,planError:'',why:'I am comfortable selling at this price while leaving room for a rally.',risk:'A larger rally could make simply holding SOL perform better.',source:'Guild event brief · Teaching example',note:'',noteSaved:false};
const premiumPerSol={105:3,110:2,115:1};
function money(v){return '$'+Number(v).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});}
function signed(v){return(v<0?'−':'+')+money(Math.abs(v));}
function quantity(){return Math.max(.1,Number(state.quantity)||1);}
function gross(){return quantity()*premiumPerSol[state.strike];}
function fee(){return quantity()*.10;}
function net(){return gross()-fee();}
function esc(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function heading(e,t,d){return `<div class="page-head"><p class="eyebrow">${e}</p><h2>${t}</h2><p>${d}</p></div>`;}
function action(text,target,type=''){return `<button class="btn ${type}" onclick="go('${target}')">${text}</button>`;}
function handoff(text,target,place='Telegram',secondary=false){return `<button class="btn ${secondary?'secondary':'handoff-btn'}" onclick="go('${target}')">${text}<span class="destination">${place==='Telegram'?'↗ Telegram group':'↗ Standalone web app'}</span></button>`;}
function explanation(){return `<details class="learn"><summary>New to covered calls? Start here</summary><p>You own SOL and sell someone the right to buy it at an agreed price, called the strike. They pay you a premium, and you reserve the required SOL to cover your obligation.</p><p>If the price rallies above the strike, your gains are capped. If SOL falls, the premium offsets only part of the loss. The provider sets exercise and settlement terms.</p></details>`;}
function terms(){return `<div class="terms-grid"><div><p>Agreed sale price</p><strong>${money(state.strike)}</strong></div><div><p>Expiration</p><strong>7 days</strong></div><div><p>Net premium / SOL</p><strong class="cyan">${money(premiumPerSol[state.strike]-.1)}</strong></div></div>`;}
function tradeSummary(){return `<aside id="trade-summary" class="panel sticky-summary"><p class="eyebrow">Per 1 SOL · Example plan</p><p class="metric cyan">${money(premiumPerSol[state.strike]-.1)}</p><p class="small muted">Net premium after $0.10 assumed fee</p><div class="divider"></div><div class="kv"><span>Starting SOL price</span><strong>$100.00</strong></div><div class="kv"><span>Agreed sale price</span><strong>${money(state.strike)}</strong></div><div class="kv"><span>Expiration</span><strong>7 days</strong></div><div class="outcome"><p class="title">You accept a limit on gains</p><p>In this delivery example, sell the covered SOL at ${money(state.strike)} if exercised at expiry.</p></div><div class="outcome risk"><p class="title">You still carry SOL downside</p><p>A falling asset can lose much more than the premium you receive.</p></div>${action('Check the outcomes','scenarios','ghost')}</aside>`;}
function message(author,body,cls=''){return `<article class="tg-message ${cls}"><p class="tg-author">${author}</p>${body}<span class="tg-time">Illustrative conversation</span></article>`;}
function bot(body){return message('Guild Wars <span class="bot-label">BOT</span>',body,'bot-message');}
function telegramShell(title,body){return `<div class="tg-shell"><aside class="tg-list"><div class="tg-search">Search conversations</div><div class="tg-room active"><span class="avatar">A</span><div><b>Apex Syndicate</b><small>Weekly covered-call council</small></div></div><div class="tg-room"><span class="avatar dim">G</span><div><b>Guild Wars</b><small>Private vote receipts</small></div></div><div class="tg-side-note">Research in the app.<br>Discuss and decide here.</div></aside><section class="tg-conversation" aria-label="Telegram conversation preview"><header class="tg-room-head"><span class="avatar">A</span><div><h2>Apex Syndicate</h2><p>12 members · Regular Telegram group</p></div><span class="tg-menu">•••</span></header><div class="tg-pinned">⌖ Round 1 · ${title}</div><div class="tg-messages"><p class="tg-date">WEEKLY SOL COVERED CALL</p>${body}</div><div class="tg-compose"><span>Message your guild…</span><span>↗</span></div></section></div>`;}
function renderTelegram(){return telegramShell('Research is open',`${bot(`<span class="pill">Research opens before voting</span><h3>What should we do with our SOL this week?</h3><p>Compare selling a covered call with simply holding. Bring your research, then decide together.</p><div class="tg-callout">A covered call earns a premium in exchange for limiting gains above an agreed sale price. SOL can still lose value.</div><div class="kv"><span>Research & proposals</span><strong>Until Tue · 18:00 UTC</strong></div><div class="kv"><span>Vote closes</span><strong>Wed · 18:00 UTC</strong></div>${handoff('Explore this week →','research','app')}<button class="tg-button" onclick="go('research')">Learn how covered calls work ↗</button><p class="note">Live guild · Individual accounts and trade authorization.</p>`) }${message('Maya · Member',`<p>I’ll look at the events before expiry. Can someone compare the two sale prices?</p>`)}${message('You',`<p>Let’s check how each one compares with holding if SOL rallies.</p>`,'own-message')}`);}
function renderResearch(){return `${heading('Apex Syndicate · Round 1 research','Research before you decide.','One question this week: sell a covered call against SOL, or keep holding?')}
<div class="research-banner"><span class="pill amber">Teaching dataset</span><span>All market data and events below are examples, not current quotes.</span></div>
<div class="layout"><div><section class="panel"><div class="row"><div><p class="eyebrow">1 · Understand the setup</p><h3>SOL · 7-day round</h3></div><div class="snapshot"><strong>$100.00</strong><small>Reference input · T0</small></div></div><p class="desc">Use the same starting point to compare plans. Live data would show its provider and observation time.</p>${explanation()}</section>
<section class="panel"><p class="eyebrow">2 · Compare the choices</p><h3>How much upside would you keep?</h3><div class="option-cards">${[110,115].map((k,i)=>`<button class="option-card ${state.strike===k?'selected':''}" onclick="setStrike(${k})" aria-pressed="${state.strike===k}"><span class="small muted">Plan ${i?'B':'A'} · Sell at</span><strong>$${k}</strong><span>${k-100}% above starting price</span><div class="divider"></div><b>${money(premiumPerSol[k]-.1)} <small>net / SOL</small></b><span>7 days · $0.10 example fee</span></button>`).join('')}</div><p class="note">Higher sale prices keep more upside and typically pay less premium. These are hypothetical premiums per 1 SOL, assuming delivery at expiration.</p>${action('Compare what happens if SOL moves','scenarios')}${action('Keep holding is also a choice','vote','ghost')}</section>
<section class="panel"><p class="eyebrow">3 · Check the context</p><h3>What could move the market?</h3><div class="event-row"><span class="event-day">DAY 3</span><div><strong>Example macro announcement</strong><p>Check timing and uncertainty before choosing an expiry.</p><span class="source-tag">Teaching event · Source required in live app</span></div></div><div class="event-row"><span class="event-day">DAY 5</span><div><strong>Example ecosystem update</strong><p>Consider whether a rally could make holding more attractive.</p><span class="source-tag">Teaching event · Source required in live app</span></div></div><details><summary>What will sources look like?</summary><p>The live workspace should link to original announcements and show the last checked time. No event is confirmed by this preview. Option premiums come from the selected provider, separately from spot-price data.</p></details></section></div>
<aside><section class="panel"><p class="eyebrow">The guild’s research</p><h3>Evidence and a counterargument</h3><div class="research-item"><span class="small cyan">Maya · Event brief</span><p>Check whether any announcement falls inside the 7-day window before capping upside.</p></div><div class="research-item"><span class="small gold">Jon · Challenge</span><p>The premium is not the whole return. How much do we give up in a strong rally?</p></div><form onsubmit="saveNote(event)"><div class="field"><label for="research-note">Add evidence or a question</label><textarea id="research-note" placeholder="What did you find? Add a source or explain what is uncertain." required oninput="state.note=this.value">${esc(state.note)}</textarea></div><button class="btn secondary" type="submit">Save research note</button></form>${state.noteSaved?'<div class="toast" role="status">Your note is saved in this preview.</div>':''}${handoff('Discuss findings in Telegram','debate','Telegram',true)}</section><section class="panel"><h3>Ready to suggest a plan?</h3><p class="desc">Choose the terms and explain why they make sense. No trade is placed.</p>${action('Build a covered-call plan','plan')}${action('Browse broader market research','alpha','ghost')}</section></aside></div>`;}
function renderScenarios(){const s=state.scenario,k=state.strike,n=premiumPerSol[k]-.1,covered=Math.min(s,k)-100+n,hold=s-100;return `${heading('Research · Compare outcomes','What if SOL ends at…','See the total result on the same 1 SOL starting holding. The premium is only one part of the outcome.')}<div class="layout"><div><section class="panel"><p class="eyebrow">Choose an ending SOL price</p><div class="scenario-choices">${[[80,'Falls'],[105,'Small rise'],[130,'Strong rally']].map(([v,t])=>`<button class="choice ${s===v?'active':''}" onclick="setScenario(${v})" aria-pressed="${s===v}"><span>${t}</span><b>$${v}</b></button>`).join('')}</div><label class="range-label" for="scenario-range">Explore a price: <strong id="ending-price">${money(s)}</strong></label><input type="range" id="scenario-range" min="0" max="150" step="1" value="${s}" onchange="setScenario(Number(this.value))"><div class="scenario-result"><div><span class="muted small">Covered call · Sell at $${k}</span><strong class="${covered<0?'red':'cyan'}">${signed(covered)}</strong></div><div><span class="muted small">Simply hold SOL</span><strong class="${hold<0?'red':'gold'}">${signed(hold)}</strong></div></div><div class="outcome ${s<100?'risk':''}"><p class="title">${s>k?'Your upside is capped.':s<100?'The premium does not prevent a loss.':'You keep the SOL and the premium.'}</p><p>${s>k?`In this delivery example the SOL is sold at $${k}. Holding captures the full rally to $${s}.`:s<100?`SOL loses ${money(100-s)} in value. The ${money(n)} net premium offsets only part of that loss.`:`The call expires unused below its sale price, and the SOL is worth ${money(s)}.`}</p></div><div class="kv"><span>Covered call versus holding</span><strong>${signed(covered-hold)}</strong></div><details><summary>See the simple calculation</summary><p>Covered-call result = lower of the ending SOL price or the agreed sale price, minus the $100 starting value, plus ${money(n)} net premium. This uses delivery at expiry and a $0.10 fee. Other settlement types follow provider terms.</p></details></section><div class="grid2">${action('Use this in my plan','plan')}${action('Back to research','research','secondary')}</div></div><aside class="panel"><p class="eyebrow">Compare sale prices</p><h3>More premium or more upside?</h3><div class="choice-row">${[110,115].map(k=>`<button class="choice ${state.strike===k?'active':''}" onclick="setStrike(${k})"><b>$${k}</b><span>${money(premiumPerSol[k]-.1)} net</span></button>`).join('')}</div><p class="note">One 7-day expiry. No annualized yield or prediction of how likely each outcome is.</p>${explanation()}</aside></div>`;}
function renderPlan(){return `${heading('Build a proposal · No order placed','Suggest a covered-call plan.','Use a 1 SOL reference holding so everyone can compare. Members choose their own size after voting.')}<div class="layout"><div><section class="panel"><div class="step-title"><span class="step-no">1</span><h3>Reference holding</h3></div><div class="reference-holding"><strong>1 SOL</strong><span>Starting value $100 · Same basis for every proposal</span></div></section><section class="panel"><div class="step-title"><span class="step-no">2</span><h3>Expiration</h3></div><div class="choice active" style="margin-top:14px"><strong>7 days</strong><span>One shared weekly window for the MVP</span></div></section><section class="panel"><div class="step-title"><span class="step-no">3</span><h3>Your agreed sale price</h3></div><p class="desc">Called the “strike.” Gains above this price are given up.</p><div class="choice-row">${[110,115].map(k=>`<button class="choice ${state.strike===k?'active':''}" onclick="setStrike(${k})" aria-pressed="${state.strike===k}"><b>$${k}</b><strong>+${k-100}% upside</strong><span>${money(premiumPerSol[k]-.1)} net premium / SOL</span></button>`).join('')}</div></section><section class="panel"><h3>Explain it in a few sentences</h3><div class="field"><label for="plan-why">Why this plan?</label><textarea id="plan-why" oninput="state.why=this.value">${esc(state.why)}</textarea></div><div class="field"><label for="plan-risk">What could go wrong?</label><textarea id="plan-risk" oninput="state.risk=this.value">${esc(state.risk)}</textarea></div><div class="field"><label for="plan-source">Evidence or source</label><input id="plan-source" value="${esc(state.source)}" oninput="state.source=this.value"></div>${state.planError?`<p class="error" role="alert">${state.planError}</p>`:''}<button class="btn" onclick="reviewBrief()">Review the Telegram brief →</button><p class="note">Nothing is shared until you review the brief.</p></section></div>${tradeSummary()}</div>`;}
function briefBody(){return `<h3>Covered-call proposal · Sell at $${state.strike}</h3><p class="small muted">Draft brief · 1 SOL reference holding</p><div style="margin-top:20px">${terms()}</div><div class="divider"></div><p class="eyebrow">Why this plan?</p><p>${esc(state.why)}</p><p class="eyebrow" style="margin-top:20px">What could go wrong?</p><p>${esc(state.risk)}</p><div class="outcome risk"><p class="title">You still have downside risk</p><p>SOL can lose value. In a rally, gains above $${state.strike} are given up on the covered amount.</p></div><p class="note">Evidence: ${esc(state.source)}</p><p class="note">Hypothetical terms · $100 starting price · Gross premium ${money(premiumPerSol[state.strike])} less $0.10 fee · Delivery at expiry.</p>`;}
function renderBrief(){return `${heading('Review before sharing','A plan your guild can read in a minute.','The same terms and reasoning appear in the app and the Telegram proposal.')}<div class="layout"><section class="panel">${briefBody()}</section><aside class="panel"><p class="eyebrow">Next · Telegram discussion</p><h3>Bring it to the guild.</h3><p class="desc">Members can read, challenge, and follow the research link before voting opens.</p><button class="btn handoff-btn" onclick="publishPreview()">Publish proposal to Telegram<span class="destination">↗ Preview the group message</span></button>${action('Edit my proposal','plan','secondary')}<p class="note">Preview only: this button shows the next mockup. No message is sent.</p><details><summary>What happens when a plan changes?</summary><p>Discussion can improve a draft. When a ballot opens, terms are fixed to a version. Material changes require a new version and a fresh ballot.</p></details></aside></div>`;}
function renderDebate(){return telegramShell('Discuss the proposed plan',`${state.shared?'<div class="tg-local-status" role="status">Proposal shared in this local preview.</div>':''}${bot(`<span class="pill amber">Proposal · Discussion open</span><h3>Sell at $${state.strike}, or keep holding?</h3><p>Reference: 1 SOL at $100 · 7 days<br><strong>${money(premiumPerSol[state.strike]-.1)} net premium</strong> after an assumed $0.10 fee.</p><div class="tg-callout"><b>Why:</b> ${esc(state.why)}<br><br><b>Main concern:</b> ${esc(state.risk)}</div><p class="small">If SOL falls, your holding can lose value. Gains above $${state.strike} are given up.</p>${handoff('Open research & outcomes ↗','scenarios','app')}<button class="tg-button" onclick="go('plan')">Suggest a change in the app ↗</button><p class="note">Evidence: ${esc(state.source)}</p>`)}${message('Jon · Member',`<p>What if SOL reaches $130? I want to compare that with holding before we vote.</p>`)}${message('Maya · Research contributor',`<p>The outcome tool shows the upside cap. A higher strike leaves more room, with a smaller premium.</p>${handoff('View the guild research ↗','research','app',true)}`)}${bot(`<h3>Have a different view?</h3><p>Reply in this group with evidence, a question, or what would change your mind. Useful challenges earn recognition; message volume does not.</p><button class="tg-button" onclick="go('vote')">Continue to the ballot preview →</button>`)}`);}
function renderVote(){return telegramShell('Ballot · Plan v1',`${bot(`<span class="pill amber">Vote open · Plan v1</span><h3>Sell at $${state.strike}, or keep holding?</h3><p>Per 1 SOL · $100 starting value · 7 days<br><strong>${money(premiumPerSol[state.strike]-.1)} net premium</strong> after the assumed fee.</p><div class="tg-callout">Selling the call caps gains above $${state.strike}. Holding keeps the full upside and downside, with no call premium.</div><p class="small"><b>Main concern:</b> ${esc(state.risk)}</p>${handoff('Review the plan & outcomes ↗','scenarios','app')}<div class="divider"></div><p><strong>${state.vote?'9':'8'} of 12 members have voted</strong></p><p class="small muted">Closes Wed · 18:00 UTC · Quorum 7 members<br>Choice totals are revealed after closing.</p><button class="tg-button vote-choice ${state.vote==='call'?'selected':''}" onclick="castVote('call')">${state.vote==='call'?'✓ ':''}Sell the covered call at $${state.strike}</button><button class="tg-button vote-choice ${state.vote==='hold'?'selected':''}" onclick="castVote('hold')">${state.vote==='hold'?'✓ ':''}Keep holding SOL</button><p class="note">Eligible linked members only · One vote each · Change until closing. No valid decision means keep holding.</p>`)}${state.vote?message('Guild Wars · Private receipt',`<h3>Your vote is recorded.</h3><p>You selected <strong>${state.vote==='call'?'Sell the covered call':'Keep holding SOL'}</strong> on Plan v1. Tap another choice above to change it before closing.</p><p class="small muted">Only you see this receipt in the live design.</p>`,'receipt'):''}<div class="preview-only-action"><p>Explore the next state</p><button class="tg-button" onclick="go('decision')">Show an example closed ballot →</button></div>`);}
function renderDecision(){return telegramShell('Vote closed · Plan v1',`${bot(`<span class="pill">Example closed ballot</span><h3>The guild chose the covered call.</h3><p>Fixed sample result: <strong>7 sell · 2 hold · 9 of 12 voted.</strong> Quorum met.</p><div class="tg-callout">Plan v1 · Sell at $${state.strike}<br>1 SOL reference · 7-day expiry<br>${money(premiumPerSol[state.strike]-.1)} illustrative net premium / SOL</div><p>This is the guild’s plan. You decide whether to trade, and how much to cover.</p>${handoff('Review my own trade →','review','app')}<button class="tg-button" onclick="go('scenarios')">Revisit the outcomes ↗</button><p class="note">Your vote does not authorize an order. Current quotes and availability may differ.</p>`)}${message('Maya · Member',`<p>I’ll check the current premium and my own amount before authorizing.</p>`)}<p class="tg-footnote">This fixed sample outcome illustrates the next screen; it is independent of your local preview vote.</p>`);}
function renderReview(){return `${heading('From Telegram · Winning plan v1','Your amount. Your decision.','The guild selected a plan. Review your own current quote before authorizing with the provider.')}<div class="layout"><section class="panel"><p class="eyebrow">1 · Choose your own covered quantity</p><label class="small muted" for="trade-quantity">SOL to cover</label><div class="amount"><input id="trade-quantity" aria-label="Your SOL amount" type="number" min="0.1" max="10" step="0.1" value="${quantity()}" oninput="setQuantity(this.value)"><span>SOL</span></div><p class="note">Only cover crypto you hold. Available amounts and minimum sizes follow provider rules.</p><div class="divider"></div><p class="eyebrow">2 · Check the quote</p><div class="kv"><span>Agreed sale price</span><strong>${money(state.strike)} / SOL</strong></div><div class="kv"><span>Expiration</span><strong>7 days</strong></div><div class="kv"><span>Gross premium</span><strong id="review-gross">${money(gross())}</strong></div><div class="kv"><span>Assumed fee</span><strong id="review-fee">${money(fee())}</strong></div><div class="kv"><span>Net premium</span><strong id="review-net" class="cyan">${money(net())}</strong></div><p class="note">Teaching quote, not live. The live flow requests a fresh provider quote and shows its expiry. Changed or unavailable terms require another review.</p><label class="review-check"><input id="review-confirm" type="checkbox" ${state.reviewed?'checked':''} onchange="setReviewed(this.checked)"><span>I understand the upside cap, falling-asset risk, and the provider’s settlement terms.</span></label><button id="provider-button" class="btn" ${state.reviewed?'':'disabled'} onclick="previewProvider()">Preview provider authorization</button><div id="provider-status">${state.providerReview?providerStatus():''}</div></section><aside><section class="panel"><h3>What happens next?</h3><ol class="timeline"><li><i>1</i><div>Review the provider’s terms<small>Check coverage, fees, and settlement.</small></div></li><li><i>2</i><div>Authorize the individual order<small>Your account stays under your control.</small></div></li><li><i>3</i><div>Track the actual fill<small>Unfilled orders are not treated as trades.</small></div></li></ol></section><section class="panel"><h3>Prefer to sit this one out?</h3><p class="desc">You can keep participating in research and discussion without placing an order.</p>${handoff('Return to the guild','decision','Telegram',true)}</section></aside></div>`;}
function providerStatus(){return `<div class="toast" role="status">Provider handoff preview. In the live product, the provider supplies final checks and authorization.</div>${action('See an example confirmed position','position','secondary')}`;}
function renderPosition(){return `${heading('My position · Example confirmed fill','Your covered call is open.','These teaching values illustrate a filled trade. Actual provider records determine live position status.')}<div class="layout"><section class="panel"><span class="pill">Example fill</span><h3 style="margin-top:16px">${quantity()} SOL covered · Sell at $${state.strike}</h3><p class="metric cyan">${money(net())}</p><p class="muted small">Net premium received · Not total profit</p><div class="kv"><span>Expiration</span><strong>Original 7-day expiry</strong></div><div class="kv"><span>Coverage</span><strong>${quantity()} SOL reserved</strong></div><div class="outcome risk"><p class="title">Your obligation remains open.</p><p>Premium received does not remove the asset’s downside or the obligation under the call. Closing and rolling depend on provider support and current costs.</p></div>${explanation()}</section><aside class="panel"><p class="eyebrow">Next · Midweek check-in</p><h3>Revisit it with your guild.</h3><p class="desc">The bot posts one scheduled review. Bring evidence if your view changes.</p>${handoff('See the Telegram check-in','midweek')}${action('Return to research','research','ghost')}</aside></div>`;}
function renderMidweek(){return telegramShell('Scheduled midweek response',`${bot(`<span class="pill amber">Midweek review</span><h3>Has the reason for our plan changed?</h3><p>Current plan: covered call at $${state.strike}, original weekly expiry. Review new information before deciding whether to keep the plan.</p>${handoff('Review the evidence in the app ↗','research','app')}<button class="tg-button ${state.midVote==='hold'?'selected':''}" onclick="midVote('hold')">${state.midVote==='hold'?'✓ ':''}Hold the current plan</button><button class="tg-button ${state.midVote==='review'?'selected':''}" onclick="midVote('review')">${state.midVote==='review'?'✓ ':''}Request a closer review</button><p class="note">Example response ballot · One scheduled window. Your position changes only after your separate authorization.</p>`)}${state.midVote?message('Guild Wars · Private receipt',`<p>Your response is saved: <strong>${state.midVote==='hold'?'Hold the current plan':'Request a closer review'}</strong>.</p>`,'receipt'):''}${message('Jon · Member',`<p>If we change the plan, show the buyback cost and what we gain before opening another call.</p>`)}${bot(`<h3>Management options depend on the provider.</h3><p>Where supported, the app can compare buying to close, rolling to a different strike or expiry, buying a call, or adding a protective hedge. Each has its own costs and risks. Some products stay locked until expiration.</p>${handoff('See the example round results →','results','app')}`)}`);}
function renderResults(){const q=quantity(),pnl=5*q+net();return `${heading('Round complete · Example SOL ending price $105','See the whole result.','The call expires unused in this teaching example. Review the holding and the premium together.')}<div class="layout"><div><section class="panel"><p class="eyebrow">Your account · After assumed fees</p><p class="metric cyan">${signed(pnl)}</p><p class="muted">On a starting holding worth ${money(100*q)}</p><div class="divider"></div><div class="kv"><span>SOL value gain</span><strong>${signed(5*q)}</strong></div><div class="kv"><span>Gross premium</span><strong>${signed(gross())}</strong></div><div class="kv"><span>Assumed fee</span><strong>−${money(fee())}</strong></div></section><section class="panel"><h3>Same starting value and period</h3><table class="plain-table"><thead><tr><th>Strategy</th><th>Net result</th></tr></thead><tbody><tr><td>Your covered call</td><td class="cyan">${signed(pnl)}</td></tr><tr><td>Simply holding SOL</td><td>${signed(5*q)}</td></tr><tr><td>AI House · Paper benchmark</td><td>${signed(6.3*q)}</td></tr></tbody></table><details><summary>How is the House example calculated?</summary><p>The House starts with the same holding at $100 and selects a $115 call with $1.40 premium and a $0.10 fee per SOL. At $105 expiration its total gain is $6.30 per SOL. This benchmark is hypothetical.</p></details><p class="note">One positive example does not predict future returns. Ranked comparisons use the same division and published risk measures.</p></section></div><aside><section class="panel"><p class="eyebrow">Contribution recognition</p><h3>Evidence that improved the debate.</h3><p class="desc">Recognize useful research, a constructive challenge, and an honest reassessment. Quality review governs awards.</p>${action('Explore between-round research','alpha','secondary')}</section><section class="panel"><h3>Bring the learning back.</h3><p class="desc">The Telegram recap links to these results and asks what the guild would change next round.</p>${handoff('Return to Telegram','telegram')}</section></aside></div>`;}
function renderAlpha(){return `${heading('Between rounds · Guild research','Good research keeps the guild active.','Share useful crypto, stock, and market evidence beyond this week’s covered call.')}<div class="layout"><div><section class="panel"><p class="eyebrow">Research bounty · Illustrative</p><h3>Build next week’s event brief.</h3><p class="desc">Find original sources, explain uncertainty, and identify what could change the guild’s view.</p><p class="note">A funded bounty publishes its budget, deadline, and acceptance criteria before submissions.</p></section><section class="panel"><h3>What gets recognized?</h3><ul class="timeline"><li><i>1</i><div>Verified market calls<small>Register a measurable claim before its outcome. Keep misses in the record.</small></div></li><li><i>2</i><div>Sourced research<small>Complete a focused bounty or add evidence.</small></div></li><li><i>3</i><div>Constructive debate<small>Challenge a thesis or explain why your view changed.</small></div></li></ul><p class="note">No valuable rewards for likes, greetings, vote counts, posting volume, or research-page visits. Reputation stays separate from any optional future $GUILD rewards.</p></section></div><aside class="panel"><h3>Draft a tracked idea</h3><form onsubmit="saveForecast(event)"><div class="field"><label for="forecast-claim">One measurable claim</label><textarea id="forecast-claim" required placeholder="What will happen, and compared with what?"></textarea></div><div class="field"><label for="forecast-deadline">When should it be checked?</label><input id="forecast-deadline" type="date" required></div><div class="field"><label for="forecast-source">Source and success condition</label><input id="forecast-source" required></div><button class="btn" type="submit">Save a preview draft</button><div id="forecast-feedback"></div></form><p class="note">Before registration, add confidence, holdings or paid affiliations, and what would change your view. Awards follow published review and appeal rules.</p>${handoff('Continue the discussion','debate','Telegram',true)}</aside></div>`;}
const views={telegram:renderTelegram,research:renderResearch,scenarios:renderScenarios,plan:renderPlan,brief:renderBrief,debate:renderDebate,vote:renderVote,decision:renderDecision,review:renderReview,position:renderPosition,midweek:renderMidweek,results:renderResults,alpha:renderAlpha};
function render(){const s=screens.find(s=>s.id===state.screen),isTg=s.place==='Telegram';document.getElementById('preview').className='preview '+state.device+(isTg?' telegram-preview':'');document.getElementById('desktop-mode').className=state.device==='desktop'?'chosen':'';document.getElementById('mobile-mode').className=state.device==='mobile'?'chosen':'';document.getElementById('screen-picker').innerHTML=screens.map((a,i)=>`<button class="${a.id===s.id?'chosen':''}" onclick="go('${a.id}')" ${a.id===s.id?'aria-current="step"':''}>${i+1}. ${a.name}</button>`).join('');const nav=[['research','Research'],['plan','Build a plan'],['position','My position'],['alpha','Community']];document.getElementById('main-nav').innerHTML=document.getElementById('bottom-nav').innerHTML=nav.map(([id,name])=>`<button class="${state.screen===id?'active':''}" onclick="go('${id}')">${name}</button>`).join('');document.querySelector('.app-top').style.display=isTg?'none':'';document.getElementById('bottom-nav').style.display=isTg?'none':'';document.getElementById('app-main').innerHTML=views[s.id]();document.getElementById('platform-location').innerHTML=`<span class="location-dot ${isTg?'tg':''}"></span><strong>${s.place}</strong><span>${isTg?'Discuss & vote':'Research & plan'}</span>`;document.getElementById('journey').innerHTML=[['Telegram','Invitation'],['App','Research'],['App','Build plan'],['Telegram','Debate & vote'],['App','Your trade'],['Both','Review']].map(([where,label],i)=>`<div class="journey-step ${i===s.stage?'current':''}"><span>${where}</span><strong>${label}</strong></div>`).join('');document.getElementById('screen-counter').textContent=(screens.indexOf(s)+1)+' of '+screens.length+' screens · '+(state.device==='mobile'?'Mobile':'Desktop');document.getElementById('screen-note').textContent=s.note;}
function go(id){state.screen=id==='home'?'research':id;render();document.getElementById('platform-location').scrollIntoView({behavior:'instant',block:'start'});}
function setDevice(d){state.device=d;render();}
function setStrike(k){state.strike=k;state.shared=false;state.vote=null;state.reviewed=false;state.providerReview=false;render();}
function setScenario(v){state.scenario=v;render();}
function saveNote(e){e.preventDefault();state.noteSaved=true;render();}
function reviewBrief(){if(!state.why.trim()||!state.risk.trim()||!state.source.trim()){state.planError='Add a reason, a main risk, and evidence before sharing.';render();return;}state.planError='';go('brief');}
function publishPreview(){state.shared=true;go('debate');}
function castVote(v){state.vote=v;render();}
function midVote(v){state.midVote=v;render();}
function setQuantity(v){const n=Number(v);state.quantity=Number.isFinite(n)?Math.min(10,Math.max(.1,n)):1;state.reviewed=false;state.providerReview=false;document.getElementById('review-gross').textContent=money(gross());document.getElementById('review-fee').textContent=money(fee());document.getElementById('review-net').textContent=money(net());document.getElementById('review-confirm').checked=false;document.getElementById('provider-button').disabled=true;document.getElementById('provider-status').innerHTML='';}
function setReviewed(v){state.reviewed=v;document.getElementById('provider-button').disabled=!v;}
function previewProvider(){if(state.reviewed){state.providerReview=true;document.getElementById('provider-status').innerHTML=providerStatus();}}
function saveForecast(e){e.preventDefault();state.forecastSaved=true;document.getElementById('forecast-feedback').innerHTML='<div class="toast" role="status">Draft saved in this preview. Complete the record before registration.</div>';}
function previousScreen(){const i=screens.findIndex(s=>s.id===state.screen);go(screens[(i-1+screens.length)%screens.length].id);}
function nextScreen(){const i=screens.findIndex(s=>s.id===state.screen);go(screens[(i+1)%screens.length].id);}
render();

</script>
</body></html>
